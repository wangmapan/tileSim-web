[package]
name = "tilesim-workbench-launcher"
version = "0.1.0"
description = "TileSim Windows workbench launcher"
authors = ["TileSim contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "tilesim_workbench_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tilesim-workbench-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
dunce = "1.0.5"
hex = "0.4.3"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json"] }
rfd = "0.15.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "=2.11.5", features = [] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }
zeroize = "1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55.0"
